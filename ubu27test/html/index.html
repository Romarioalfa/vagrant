<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho React</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <img src="./img/41932.jpg" alt="logo do meu site " class="Logo-img">
        <div class="titulo"> Painel chopits </div>
        <nav>
            <button class="logout">Logout</button>
        </nav>

    </header>
    <div class="container">
        <aside class="sidebar ">
            <nav>
              <ul>
                 <li><a href="home">Home</a></li>
                 <li><a href="clientes">Clientes</a></li>
                  <li><a href="usuarios">usuarios</a></li>
             </ul>
            </nav>

        </aside>
        <main class="content">
            <h2>Cadastro usuarios</h2>
             <form action="enviar usuario" method="post">
                <div class="form-group">
                    <label for="nome-usuario">Nome Do Usuario</label>
                    <input type="text" id="nome-usuario" name="nome-usuario" required >
              
                </div>
                <div class="form-group">
                    <label for="email-usuario">Email do usuario</label>
                    <input type="text" id="email-usuario" name="email-usuario" required>
                </div>
                <div class=" form-group">
                    <label for="permisao">Permisao do usuario</label>
                    <input type="text" name="permisao" id="permisao" required>
                

                </div>
                <button type="submit">Enviar</button>
                
            </form>

        </main>
    </div>
        
    
</body>
</html>
